name: Capture live project thumbnails

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture published applications
        run: |
          mkdir -p artifacts
          node <<'NODE'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const apps = [
              { name: "Open Sound", url: "https://open-sound-music.vercel.app/", path: "artifacts/open-sound-preview.jpg" },
              { name: "Price Search", url: "https://price-search-three.vercel.app/", path: "artifacts/price-search-preview.jpg" },
            ];
            let failures = [];

            for (const app of apps) {
              const context = await browser.newContext({
                viewport: { width: 1440, height: 900 },
                deviceScaleFactor: 2,
                colorScheme: "dark",
                reducedMotion: "reduce",
              });
              const page = await context.newPage();
              page.setDefaultTimeout(30000);
              const pageErrors = [];
              page.on("pageerror", error => pageErrors.push(error.message));

              try {
                const response = await page.goto(app.url, { waitUntil: "domcontentloaded", timeout: 90000 });
                if (!response || !response.ok()) {
                  throw new Error("HTTP response: " + (response ? response.status() : "none"));
                }
                await page.waitForLoadState("networkidle", { timeout: 25000 }).catch(() => {});
                await page.evaluate(() => document.fonts && document.fonts.ready);
                await page.waitForTimeout(9000);
                await page.evaluate(() => window.scrollTo(0, 0));

                const info = await page.evaluate(() => ({
                  title: document.title,
                  url: location.href,
                  text: (document.body && document.body.innerText || "").slice(0, 1800),
                  images: Array.from(document.images).filter(img => img.complete && img.naturalWidth > 0).length,
                }));
                if (!info.text.trim()) throw new Error("La página no contiene texto visible");
                if (/404: NOT_FOUND|Application error|This page could not be found/i.test(info.text)) {
                  throw new Error("La aplicación devolvió una pantalla de error");
                }

                await page.screenshot({ path: app.path, type: "jpeg", quality: 92, animations: "disabled" });
                console.log("\\n--- " + app.name + " ---\\n" + JSON.stringify(info, null, 2));
                if (pageErrors.length) console.log("Page errors: " + pageErrors.join(" | "));
              } catch (error) {
                failures.push(app.name + ": " + error.message);
                console.error(app.name + " capture failed: " + error.stack);
              } finally {
                await context.close();
              }
            }

            await browser.close();
            if (failures.length) throw new Error(failures.join("\\n"));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: live-project-thumbnails
          path: artifacts/*.jpg
          if-no-files-found: error
          retention-days: 2
